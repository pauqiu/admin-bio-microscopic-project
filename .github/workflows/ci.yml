name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restaurar dependencias
        run: dotnet restore UCR.EB.BioMicroscopeAdmin.sln
      - name: Compilar
        run: dotnet build UCR.EB.BioMicroscopeAdmin.sln --configuration Release --no-restore
      - name: Correr tests
        run: dotnet test UCR.EB.BioMicroscopeAdmin.sln --configuration Release --no-build --verbosity normal
